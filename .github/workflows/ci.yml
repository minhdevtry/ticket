name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: gắn hoặc gỡ nhãn `no-docs` phải chạy lại job docs-required.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần lịch sử đầy đủ: chế độ `--base` của lint baseline đọc nội dung file ở
          # nhánh nền bằng `git show`, nên phải có commit của base trong clone.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Gọi đúng `bun run verify` để CI và lệnh cục bộ không trôi lệch nhau.
      - name: Verify (lint + typecheck + test + scan + docs checks)
        run: bun run verify
      # PR xếp chồng (base là nhánh khác main): ngưỡng chung của repo chưa tính phần
      # của PR nền, nên so SỐ LỖI MỚI so với nhánh nền.
      - name: Lint baseline theo nhánh nền
        if: github.event_name == 'pull_request'
        run: bun run scripts/lint-baseline.ts --base "${{ github.event.pull_request.base.sha }}"

  # Docs không được phép cũ đi: build site (link chết = lỗi), TypeDoc (cảnh báo = lỗi),
  # typecheck mọi mẫu `ts check`, đối chiếu docs với code. Xem CONTRIBUTING.md, mục Tài liệu.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build site, TypeDoc, snippets, refs
        run: bun run docs:check

  # Đổi hành vi công khai (packages/*/src, app, deploy) thì phải đụng docs hoặc CHANGELOG,
  # trừ khi PR có nhãn `no-docs` (chỉ cho refactor thuần và test).
  docs-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Docs required
        run: bun run scripts/check-docs-touched.ts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
